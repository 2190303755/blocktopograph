[versions]
kotlin = "2.4.21"
serialization = "1.13.0"
agp = "9.5.1"
compose-bom = "2026.11.01"
paging = "3.5.1"
activity = "1.13.0"
material3 = "1.6.0-alpha01"
lifecycle = "2.11.0"
junit = "4.13.2"
annotation = "1.11.0"
appcompat = "1.8.0"
material = "1.14.0"
guava = "33.8.0-android"
leveldb-api = "1.1.0"
core-ktx = "1.19.1"
splashscreen = "1.2.0"
fragment-ktx = "1.9.1"
concurrent = "1.3.0"
drawerlayout = "1.2.0"
window = "1.5.1"
shizuku = "13.1.5"
reorderable = "3.1.0"
fastutil = "8.5.19"
snappy = "0.5"
robolectric = "4.18.1"
junit-ext = "1.3.0"
mockito = "6.4.0"
coil = "3.6.3"
datastore = "1.3.0"
nav3 = "1.2.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
material-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui-util = { module = "androidx.compose.ui:ui-util" }
compose-ui-unit = { module = "androidx.compose.ui:ui-unit" }

nav3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3" }
nav3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3" }

lifecycle-viewmodel-nav3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

paging-common = { module = "androidx.paging:paging-common", version.ref = "paging" }
paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }

junit = { module = "junit:junit", version.ref = "junit" }
junit-ext = { module = "androidx.test.ext:junit", version.ref = "junit-ext" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito" }

annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment-ktx" }
drawerlayout = { module = "androidx.drawerlayout:drawerlayout", version.ref = "drawerlayout" }
window = { module = "androidx.window:window", version.ref = "window" }
concurrent = { module = "androidx.concurrent:concurrent-futures", version.ref = "concurrent" }

coil = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

guava = { module = "com.google.guava:guava", version.ref = "guava" }

leveldb-api = { module = "com.hivemc.leveldb:leveldb-api", version.ref = "leveldb-api" }
snappy = { module = "org.iq80.snappy:snappy", version.ref = "snappy" }

shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }

reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }

robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
